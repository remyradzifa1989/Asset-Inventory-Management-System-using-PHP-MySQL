<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Luar Talian · AIMS</title>
<style>
  :root { --navy:#0f172a; --navy2:#1e293b; --blue:#3b82f6; --muted:#94a3b8; }
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; }
  body {
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:linear-gradient(180deg,var(--navy) 0%,var(--navy2) 100%);
    color:#e2e8f0; display:flex; align-items:center; justify-content:center;
    text-align:center; padding:24px;
  }
  .card { max-width:420px; }
  .logo {
    width:96px; height:96px; border-radius:22px; object-fit:cover;
    box-shadow:0 12px 40px rgba(0,0,0,.4); margin-bottom:22px;
  }
  h1 { font-size:22px; margin:0 0 8px; font-weight:700; }
  p { color:var(--muted); font-size:14px; line-height:1.6; margin:0 0 22px; }
  .btn {
    display:inline-flex; align-items:center; gap:8px; cursor:pointer;
    background:linear-gradient(135deg,#3b82f6 0%,#8b5cf6 100%); color:#fff;
    border:none; border-radius:12px; padding:12px 22px; font-size:15px; font-weight:600;
    box-shadow:0 8px 24px rgba(59,130,246,.35); transition:transform .12s;
  }
  .btn:active { transform:scale(.97); }
  .hint { margin-top:18px; font-size:12px; color:#64748b; }
</style>
</head>
<body>
  <div class="card">
    <img class="logo" src="assets/images/web-app-manifest-192x192.png" alt="AIMS" onerror="this.style.display='none'">
    <h1>Anda di luar talian</h1>
    <p>AIMS memerlukan sambungan internet untuk memaparkan data terkini.
       Sila semak sambungan anda dan cuba semula.</p>
    <button class="btn" onclick="location.reload()">
      <span>&#x21bb;</span> Cuba semula
    </button>
    <div class="hint">AIMS — Asset Inventory Management System</div>
  </div>
  <script>
    // Auto-reload bila sambungan kembali
    window.addEventListener('online', function () { location.reload(); });
  </script>
</body>
</html>
